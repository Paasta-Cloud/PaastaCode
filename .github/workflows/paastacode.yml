name: PaastaCode checks

on:
  push:
    paths: ["extensions/paastacode/**", ".github/workflows/paastacode.yml"]
  pull_request:
    paths: ["extensions/paastacode/**", ".github/workflows/paastacode.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extensions/paastacode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/paastacode/package-lock.json
      - run: npm ci --omit=dev
      - run: npm run check
      - run: npm test
