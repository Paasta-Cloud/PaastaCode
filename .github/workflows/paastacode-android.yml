name: PaastaCode Android
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/paastacode/android/**'
      - 'extensions/paastacode/web/**'
      - 'extensions/paastacode/scripts/android-release.mjs'
      - 'extensions/paastacode/test/android*'
      - '.github/workflows/paastacode-android.yml'
  push:
    branches: [android-client]
permissions:
  contents: read
concurrency:
  group: paastacode-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extensions/paastacode/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Check release signing guard
        run: |
          if ./gradlew --no-daemon assembleRelease > release-guard.log 2>&1; then
            echo 'Release packaging unexpectedly accepted missing signing configuration'
            exit 1
          fi
          grep -q 'Publisher signing is not configured' release-guard.log
      - name: Prepare unsigned release for offline signing
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease lintRelease -PprepareUnsignedRelease=true
          mkdir -p offline-signing
          cp app/build/outputs/apk/release/*-unsigned.apk offline-signing/
          cp app/build/outputs/bundle/release/*.aab offline-signing/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" offline-signing/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/*-unsigned.apk > offline-signing/apk-metadata.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/*-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PaastaCode-Android-UNSIGNED-offline-signing
          path: extensions/paastacode/android/offline-signing/*
      - uses: actions/upload-artifact@v4
        with:
          name: PaastaCode-Android-debug
          path: extensions/paastacode/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PaastaCode-Android-lint
          path: extensions/paastacode/android/app/build/reports/lint-results-*.html
  launch:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: PaastaCode-Android-UNSIGNED-offline-signing
          path: launch-apk
      - name: Sign release for emulator only
        run: |
          export EMULATOR_KEY_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator.p12" -storepass:env EMULATOR_KEY_PASSWORD -alias emulator -keyalg RSA -validity 2 -dname CN=Emulator -noprompt
          java -jar launch-apk/apksigner.jar sign --ks "$RUNNER_TEMP/emulator.p12" --ks-pass env:EMULATOR_KEY_PASSWORD --out launch-apk/app-release.apk launch-apk/app-release-unsigned.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: bash extensions/paastacode/android/test-launch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PaastaCode-Android-launch
          path: launch-evidence/
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/paastacode
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extensions/paastacode/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node --test test/android.test.mjs test/hosted.test.mjs
      - run: node test/android-browser.mjs
      - run: node test/browser.mjs
      - run: node test/cloud-hub-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PaastaCode-Android-web-captures
          path: extensions/paastacode/.artifacts/*.png
